# ==========================================================
# ? Basic Spring Boot Configuration
# ==========================================================
spring.application.name=Experiments
server.port=8080

# ==========================================================
# ?? Database Configuration (MySQL example)
# ==========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/experiments
spring.datasource.username=root
spring.datasource.password=Vamshi@42379
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================================
# ? JPA / Hibernate Configuration
# ==========================================================
# Automatically create/update tables based on entities
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in the console
spring.jpa.show-sql=true

# Format SQL output (for readability)
spring.jpa.properties.hibernate.format_sql=true

# Set the dialect for MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ==========================================================
# ? Logging (Optional)
# ==========================================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE